# One command to run the whole thing: docker compose up
#
# Postgres owns the data and enforces every access rule; the API and web app are
# replaceable. That is deliberate — the schema is the asset.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: schooldb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations and seeds run automatically, in filename order, on first boot.
      - ./db/migrations:/docker-entrypoint-initdb.d/1-migrations:ro
      - ./db/seed/frameworks:/docker-entrypoint-initdb.d/2-seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schooldb"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: devpassword
      PGDATABASE: schooldb
      NODE_ENV: development
      PORT: "3001"
      WEB_ORIGIN: http://localhost:5173
      SESSION_SECRET: dev-only-insecure-secret-change-me
    command: sh -c "npm install --no-fund --no-audit && npx tsx src/server.ts"
    volumes:
      - ./api:/app
      - api_modules:/app/node_modules
    ports: ["3001:3001"]

  web:
    image: node:22-alpine
    working_dir: /app
    depends_on: [api]
    command: sh -c "npm install --no-fund --no-audit && npx vite --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://api:3001
    volumes:
      - ./web:/app
      - web_modules:/app/node_modules
    ports: ["5173:5173"]

volumes:
  pgdata:
  api_modules:
  web_modules:
